[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlock-checkpoint"
version = "0.1.0"
description = "Airlock Checkpoint — tool-call authorization (PEP/PDP/PIP) for AI agents"
requires-python = ">=3.11"
dependencies = [
    "airlock-protocol>=1.0.0",
    "cedarpy",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0,<3.0",
    "httpx>=0.28.0,<1.0",
    "pynacl>=1.6.0,<2.0",
    "litellm>=1.50.0,<2.0",
    "python-dotenv>=1.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["airlock_checkpoint"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["cedarpy", "cedarpy.*", "litellm", "litellm.*", "dotenv", "dotenv.*"]
ignore_missing_imports = true

# Recent numpy ships stubs using PEP 695 `type` statements, which mypy rejects
# under python_version = 3.11 and which abort the whole run. We never import
# numpy directly (it arrives transitively via the airlock-protocol dependency),
# so skip analyzing its stubs rather than raising the target version, which
# would change how our own code is checked. Mirrors the public repo's config.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
